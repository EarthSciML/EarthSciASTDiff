# Runnable examples for the generated API reference (tools/api_docs/README.md §3
# in EarthSciML/earthsci.dev). Built against the in-repo crate, never a
# published release. Run with `tools/api_docs/rust.sh --examples-only` from there.
[package]
name = "earthsci-astdiff-api-examples"
version = "0.0.0"
edition = "2021"
publish = false

# A workspace of its own, so cargo never looks for one further up the tree.
[workspace]

[dependencies]
earthsci-astdiff = { path = "../../../../pkg/earthsci-astdiff-rs" }
# EarthSciAST is a sibling checkout (../EarthSciAST), as in conformance.yml.
earthsci-ast = { path = "../../../../../EarthSciAST/pkg/earthsci-ast-rs" }
serde_json = "1"

# earthsci-astdiff depends on the registry earthsci-ast; patch it to the sibling
# checkout so the examples and the crate share one earthsci_ast (otherwise their
# EsmFile types differ).
[patch.crates-io]
earthsci-ast = { path = "../../../../../EarthSciAST/pkg/earthsci-ast-rs" }

# The examples share one helper: `fixture`, which finds the shared `.esm`
# documents relative to this directory rather than the working directory.
[lib]
path = "support.rs"

[profile.dev]
debug = false

[[example]]
name = "jacobians"
path = "jacobians.rs"
