# Topic grouping of the canonical STABLE operations, for the generated API
# reference (tools/api_docs/render.py in EarthSciML/earthsci.dev).
# Groups appear in this order.

[[group]]
id = "differentiate"
title = "Differentiate a model"
description = "Take a model or flattened system, differentiate its right-hand side, and get back structured Jacobian bands."
ops = ["sysview", "jacobian_bands", "forcing_names", "jacobian_columns", "jacobian_bands2", "band", "jac_entry", "jac_entry2", "sys_view", "site", "dscalar", "simplify_branches", "band_error", "derivative_rule_error"]

[[group]]
id = "structure"
title = "Sparsity and structure"
description = "The exact structural sparsity pattern, the structure classification, and the symbolic factorization plan."
ops = ["jacobian_pattern", "detect_structure", "column_lines", "plan_factorization", "block_diagonal_plan", "column_block_plan", "serialize_plan", "lu_fill", "markowitz_ordering"]

[[group]]
id = "evaluate"
title = "Evaluate the Jacobian"
description = "The Jacobian and its products as documents an EarthSciAST evaluator runs, the storage map that places the band values, and (Python and Rust, until they emit the documents) prepared evaluators."
ops = ["evaluation_document", "jvp_document", "vjp_document", "hvp_document", "jac_prototype", "scatter_plan", "bind_plan", "assemble_jacobian", "prepare_jacobian", "jacobian_evaluator", "vjp", "vjp_forcing", "prepare_hvp", "hvp_evaluator", "hvp"]

[[group]]
id = "serialize"
title = "Serialize as a document block"
description = "The `jacobians` document block, so the Jacobian is itself an `.esm` artifact any binding can evaluate."
ops = ["jacobian_block", "jacobian_document", "parse_jacobian_blocks", "serialize_band", "cse_templates", "stable_json"]
