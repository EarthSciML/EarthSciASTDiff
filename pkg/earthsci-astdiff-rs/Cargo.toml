[package]
name = "earthsci-astdiff"
version = "0.6.2"
edition = "2021"
license = "AGPL-3.0-only"
description = "Analytical sparse Jacobians for EarthSciAST (.esm) models by symbolic differentiation of the expression AST"

[dependencies]
# The crates.io releases this crate is tested with: conformance.yml runs the
# tests at both ends of the range (the floor is 0.15, the first release with
# the `operators` block and `apply_operator` references that derived
# documents carry). Raise the floor only to a published
# release. upstream-main.yml tests against EarthSciAST `main` by patching in
# a sibling checkout, which works locally too:
#   cargo test --config 'patch.crates-io.earthsci-ast.path="../../../EarthSciAST/pkg/earthsci-ast-rs"'
# The floor admits 0.14 only while the reference-keeping Rust EarthSciAST
# is unreleased (its branch is still versioned 0.14.0; see [patch] below).
# Back to ">=0.15, <0.16" when 0.15 is published.
earthsci-ast = ">=0.14, <0.16"
indexmap = "2"
# the shortest round-trip digits, as the Julia reference writes them
# (`canonical_float`); already in the tree through serde_json
ryu = "1"
serde_json = "1"

[lints.clippy]
# The sparsity and factorization code indexes matrices the way the math is
# written (`p[i][j] = p[i][j] || p[k][j]` reads two rows at once), which an
# iterator rewrite would obscure.
needless_range_loop = "allow"

# Unreleased: the Rust EarthSciAST that keeps operator references at load and
# flatten (EarthSciML/EarthSciAST#772). Drop when it is released.
[patch.crates-io]
earthsci-ast = { git = "https://github.com/ctessum-claude/EarthSciSerialization.git", rev = "ff2da2d3256176a314a7f18004bfab32c78bfa68" }
