[package]
name = "earthsci-astdiff"
version = "0.3.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Analytical sparse Jacobians for EarthSciAST (.esm) models by symbolic differentiation of the expression AST"

[dependencies]
# The crates.io releases this crate is tested with: conformance.yml runs the
# tests at both ends of the range (the floor is the lowest release the tests
# pass against; 0.4 lacks `rhs_program`). Raise the floor only to a published
# release. upstream-main.yml tests against EarthSciAST `main` by patching in
# a sibling checkout, which works locally too:
#   cargo test --config 'patch.crates-io.earthsci-ast.path="../../../EarthSciAST/pkg/earthsci-ast-rs"'
earthsci-ast = ">=0.5, <0.9"
indexmap = "2"
serde_json = "1"

[lints.clippy]
# The sparsity and factorization code indexes matrices the way the math is
# written (`p[i][j] = p[i][j] || p[k][j]` reads two rows at once), which an
# iterator rewrite would obscure.
needless_range_loop = "allow"
