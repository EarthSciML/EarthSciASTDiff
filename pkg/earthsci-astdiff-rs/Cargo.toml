[package]
name = "earthsci-astdiff"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Analytical sparse Jacobians for EarthSciAST (.esm) models by symbolic differentiation of the expression AST"

[dependencies]
# The crates.io release, so this crate can be published. Conformance CI tests
# against EarthSciAST `main` instead by patching in the sibling checkout:
#   cargo test --config 'patch.crates-io.earthsci-ast.path="../../../EarthSciAST/pkg/earthsci-ast-rs"'
# (the same layout as the Python binding's tests/conftest.py fallback).
earthsci-ast = "0.6"
indexmap = "2"
serde_json = "1"
