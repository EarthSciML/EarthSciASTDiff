[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earthsci-astdiff"
version = "0.7.0"
description = "Analytical sparse Jacobians for EarthSciAST (.esm) models by symbolic differentiation of the expression AST"
readme = "README.md"
license = "AGPL-3.0"
requires-python = ">=3.11"
# Tested at both ends of the range by conformance.yml, each on the
# requires-python floor and on the newest Python
# (scripts/earthsci-ast-versions.py PYTHON_NEWEST); raise the floor only to a
# published release. 0.15 is the floor: the `operators` block and
# `apply_operator` references derived documents carry.
dependencies = ["earthsci-ast>=0.15,<0.16"]

[project.optional-dependencies]
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/earthsci_astdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
