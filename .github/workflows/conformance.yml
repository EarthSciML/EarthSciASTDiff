# Cross-language conformance: every binding against the shared fixtures
# (tests/valid) and goldens (tests/goldens), built against the PUBLISHED
# EarthSciAST releases its manifest admits — what a user who installs this
# package actually gets. This is the release gate (release-register.yml calls
# it); testing against EarthSciAST `main` is upstream-main.yml's job, an early
# warning that does not gate anything.
#
# Each binding is tested at both ends of its declared range: the LOWEST
# release inside it, so the floor in the manifest is a tested fact, and the
# LATEST, what a fresh install resolves to. scripts/earthsci-ast-versions.py
# reads the three manifests and the three registries and hands each job its
# matrix; when the two ends are the same release the binding runs once. A
# manifest whose range no published release satisfies fails the `resolve`
# job: release EarthSciAST first, then raise the floor here.
#
# Each binding's faq-tag test asserts a NON-EMPTY band list on every array
# fixture, so an upstream change that empties the bands fails loudly instead
# of silently producing an all-zero Jacobian.
name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  workflow_call:

jobs:
  resolve:
    name: Resolve EarthSciAST releases
    runs-on: ubuntu-latest
    outputs:
      julia: ${{ steps.versions.outputs.julia }}
      python: ${{ steps.versions.outputs.python }}
      rust: ${{ steps.versions.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: versions
        run: python scripts/earthsci-ast-versions.py --github-output

  julia:
    name: Julia (reference), EarthSciAST ${{ matrix.label }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.julia) }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: julia-actions/cache@v3
      # Manifest.toml is gitignored, so the `add` resolves EarthSciAST to
      # exactly this release (from General) for the test environment; Pkg
      # refuses one outside [compat].
      - name: Test
        env:
          EARTHSCI_AST_VERSION: ${{ matrix.version }}
        run: |
          julia --project=pkg/EarthSciASTDiff.jl -e '
            using Pkg
            Pkg.add(name="EarthSciAST", version=ENV["EARTHSCI_AST_VERSION"])
            Pkg.status("EarthSciAST")
            Pkg.test()'

  python:
    name: Python, EarthSciAST ${{ matrix.label }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.python) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Installing the package itself alongside the pinned release makes pip
      # check the pin against pyproject.toml's requirement.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e pkg/earthsci-astdiff-py "earthsci-ast==${{ matrix.version }}" pytest
          python -m pip show earthsci-ast
      - name: Test
        working-directory: pkg/earthsci-astdiff-py
        run: python -m pytest tests -q

  rust:
    name: Rust, EarthSciAST ${{ matrix.label }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.rust) }}
    defaults:
      run:
        working-directory: pkg/earthsci-astdiff-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pkg/earthsci-astdiff-rs
          key: earthsci-ast-${{ matrix.version }}
      # No Cargo.lock is committed (this is a library); lock the crates.io
      # earthsci-ast to exactly this release. Cargo refuses one outside
      # Cargo.toml's requirement.
      - name: Test
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo update -p earthsci-ast --precise "${{ matrix.version }}"
          cargo tree -i earthsci-ast -e normal --depth 0
          cargo test --locked
