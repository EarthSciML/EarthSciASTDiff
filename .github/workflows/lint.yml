name: Lint

# Format and lint gate from the shared workflow in EarthSciML/.github, which
# pins the tool versions. This repository's rules live in ruff.toml and the
# crate's [lints] table.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: EarthSciML/.github/.github/workflows/lint.yml@main
    with:
      rust-dirs: '["pkg/earthsci-astdiff-rs"]'
      rust-clippy: '[{"dir": "pkg/earthsci-astdiff-rs"}]'
      python-dir: "."
      julia-paths: "."
