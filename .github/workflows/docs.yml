name: docs

# Installed in each EarthSci source repo as .github/workflows/docs.yml.
# Nothing of the docs machinery lives in this repo: extraction, rendering and
# bundling all run from EarthSciML/earthsci.dev (DESIGN.md there).
#
# On push to main: extract API docs, build the docs bundle, merge it into this
# repo's `docs-bundle` branch as the `dev` version and notify earthsci.dev,
# which rebuilds the site.
# On a push of a release tag vX.Y.Z: the same, from the code at that tag (every
# prebuild step runs), published as that version of the whole docs. The site
# then offers it in the version selector.
# On pull requests: the same, minus publishing and notifying (validation only).
#
# Needs the repo (or org) secrets DOCS_APP_ID and DOCS_APP_PRIVATE_KEY: a GitHub
# App installed on EarthSciML/earthsci.dev with contents:write, used to notify
# the site (repository_dispatch).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Publishing merges into one shared branch; tools/publish.py retries on a
# conflict, but a tag build should still never be cancelled by a later push.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      bindings: ${{ steps.plan.outputs.bindings }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: EarthSciML/earthsci.dev
          ref: main
          path: .earthsci-dev
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Prints the bindings in docs/api/config.toml as a JSON array ([] when
      # the repo has no API reference).
      - id: plan
        run: echo "bindings=$(python .earthsci-dev/tools/api_docs/plan.py --repo-root .)" >> "$GITHUB_OUTPUT"

  extract:
    needs: plan
    if: needs.plan.outputs.bindings != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A failing binding is reported but does not block the bundle; it renders
    # as "not extracted in this build". Remove to make failures fatal.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        binding: ${{ fromJSON(needs.plan.outputs.bindings) }}
    steps:
      - uses: actions/checkout@v7
      # The Julia and Rust packages (and their docs examples) depend on a
      # SIBLING EarthSciAST checkout at ../EarthSciAST, as in upstream-main.yml.
      # actions/checkout cannot write outside the workspace, so check it out
      # inside and link it into place.
      - uses: actions/checkout@v7
        with:
          repository: EarthSciML/EarthSciAST
          ref: main
          path: .deps/EarthSciAST
      - name: Link sibling EarthSciAST
        run: ln -s "$GITHUB_WORKSPACE/.deps/EarthSciAST" "$GITHUB_WORKSPACE/../EarthSciAST"
      # EarthSciAST `main` may carry a version the manifests do not admit yet;
      # widen them for this build only, or Julia refuses the checkout and the
      # Rust examples' [patch.crates-io] goes unused (two `EsmFile` types).
      - name: Admit the EarthSciAST checkout
        run: python3 scripts/earthsci-ast-versions.py --admit-checkout ../EarthSciAST
      # The extraction builds the crate first and the examples then reuse its
      # Cargo.lock. Without the patch the crate locks the crates.io
      # earthsci-ast, and when the checkout is a newer version than crates.io
      # has (main released ahead of publishing), Cargo keeps that locked
      # version and ignores the examples' [patch.crates-io]: two `EsmFile`
      # types. Patch every cargo build of this job to the checkout instead.
      # The path is the unresolved ../EarthSciAST link, as the examples
      # manifest names it, so Cargo sees one package.
      - name: Patch cargo to the EarthSciAST checkout
        if: matrix.binding == 'rust'
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          printf '[patch.crates-io]\nearthsci-ast = { path = "%s" }\n' \
            "$(dirname "$GITHUB_WORKSPACE")/EarthSciAST/pkg/earthsci-ast-rs" \
            >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      - uses: EarthSciML/earthsci.dev/.github/actions/api-extract@main
        with:
          binding: ${{ matrix.binding }}

  bundle:
    needs: [plan, extract]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write   # push the docs-bundle branch
    steps:
      - uses: actions/checkout@v7

      # Prebuild (docs/site.toml `prebuild`): the spec page is generated from
      # esm-jacobian-spec.md rather than committed.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 docs/build_content.py

      - name: Download extracted docstrings
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: api-docs-*
          path: build/api-docs
          merge-multiple: true

      # Short-lived token for notifying earthsci.dev; not minted on pull requests,
      # which only validate.
      - name: Create site dispatch token
        id: app-token
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: EarthSciML
          repositories: earthsci.dev

      - uses: EarthSciML/earthsci.dev/.github/actions/docs-bundle@main
        with:
          dispatch-token: ${{ steps.app-token.outputs.token }}
